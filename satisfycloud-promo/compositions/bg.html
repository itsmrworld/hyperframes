<template>
  <style>
    #root { position: absolute; inset: 0; background: #02030f; overflow: hidden; }
    #bgc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
  <div id="root" data-composition-id="bg" data-width="1920" data-height="1080">
    <canvas id="bgc" data-layout-ignore></canvas>
  </div>
  <script>
    (function () {
      var root = document.getElementById("root");
      var cv = document.getElementById("bgc");
      var W = (cv.width = +root.getAttribute("data-width") || 1920);
      var H = (cv.height = +root.getAttribute("data-height") || 1080);
      var ctx = cv.getContext("2d");
      var K = Math.min(W, H) / 1080;
      // seeded rng (mulberry32)
      function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      var R = rng(7);
      var P = [
        { top: [2, 3, 15], mid: [5, 11, 46], bot: [11, 20, 69], neb: 0.35, stars: 0.5, city: 1 },
        { top: [5, 7, 15], mid: [13, 18, 34], bot: [26, 32, 48], neb: 0.06, stars: 0.12, city: 0.18 },
        { top: [2, 6, 30], mid: [10, 38, 150], bot: [11, 100, 248], neb: 1, stars: 1, city: 0 },
        { top: [2, 5, 26], mid: [7, 27, 107], bot: [10, 47, 184], neb: 0.8, stars: 0.9, city: 0 },
        { top: [247, 249, 255], mid: [227, 236, 255], bot: [187, 208, 255], neb: 0.3, stars: 0, city: 0 },
      ];
      var S = { p: 0, t: 0, tint: 0, zoom: 0, flash: 0 };
      function lerp(a, b, k) { return a + (b - a) * k; }
      function mixc(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
      function rgb(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a === undefined ? 1 : a) + ")"; }
      var blobs = [], stars = [], city = [];
      for (var i = 0; i < 7; i++) blobs.push({ x: R() * W, y: R() * H, r: (380 + R() * 420) * K, vx: (6 + R() * 14) * K, vy: (R() - 0.5) * 6 * K, k: R() });
      for (i = 0; i < 520; i++) { var L = i % 3; stars.push({ x: R() * W, y: R() * H, s: (0.5 + R() * 1.4 + L * 0.35) * K, a: 0.35 + R() * 0.65, L: L, w: R() < 0.12 }); }
      for (i = 0; i < 70; i++) city.push({ x: R() * W, y: H * (0.6 + R() * 0.22), r: (5 + R() * R() * 46) * K, w: R(), a: 0.18 + R() * 0.5 });
      function pal() {
        var f = Math.min(Math.max(S.p, 0), P.length - 1.0001), i0 = Math.floor(f), k = f - i0, A = P[i0], B = P[i0 + 1];
        return { top: mixc(A.top, B.top, k), mid: mixc(A.mid, B.mid, k), bot: mixc(A.bot, B.bot, k), neb: lerp(A.neb, B.neb, k), stars: lerp(A.stars, B.stars, k), city: lerp(A.city, B.city, k), light: f > 3 ? Math.min(f - 3, 1) : 0 };
      }
      function draw() {
        var t = S.t, c = pal();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgb(c.top)); g.addColorStop(0.55, rgb(c.mid)); g.addColorStop(1, rgb(c.bot));
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        var z = 1 + S.zoom;
        ctx.setTransform(z, 0, 0, z, (W - W * z) / 2, (H - H * z) / 2);
        // nebula
        var cols = [[11, 100, 248], [96, 72, 255], [40, 60, 200]];
        ctx.globalCompositeOperation = c.light > 0.5 ? "source-over" : "lighter";
        for (var i = 0; i < blobs.length; i++) {
          var b = blobs[i], span = W + b.r * 2;
          var x = ((b.x + b.vx * t) % span + span) % span - b.r, y = b.y + b.vy * t;
          var col = mixc(cols[i % 3], cols[(i + 1) % 3], S.tint * 0.8 + b.k * 0.2);
          var al = 0.30 * c.neb * (c.light > 0 ? 0.6 : 1);
          var rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
          rg.addColorStop(0, rgb(col, al)); rg.addColorStop(0.5, rgb(col, al * 0.35)); rg.addColorStop(1, rgb(col, 0));
          ctx.fillStyle = rg; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
        }
        ctx.globalCompositeOperation = "source-over";
        // stars (3 parallax layers, constant-velocity camera)
        if (c.stars > 0.01) {
          for (i = 0; i < stars.length; i++) {
            var s = stars[i], sp = (4 + s.L * 7) * K, sx = (((s.x - sp * t) % W) + W) % W;
            ctx.fillStyle = s.w ? "rgba(255,226,190," + s.a * c.stars + ")" : "rgba(214,228,255," + s.a * c.stars + ")";
            ctx.fillRect(sx, s.y, s.s, s.s);
          }
        }
        // city bokeh (hook)
        if (c.city > 0.01) {
          for (i = 0; i < city.length; i++) {
            var q = city[i], cx = q.x, cy = q.y;
            var cc = q.w < 0.45 ? [255, 196, 120] : q.w < 0.8 ? [190, 214, 255] : [255, 255, 255];
            var rr = ctx.createRadialGradient(cx, cy, 0, cx, cy, q.r);
            rr.addColorStop(0, rgb(cc, q.a * c.city * 0.9)); rr.addColorStop(0.6, rgb(cc, q.a * c.city * 0.35)); rr.addColorStop(1, rgb(cc, 0));
            ctx.fillStyle = rr; ctx.fillRect(cx - q.r, cy - q.r, q.r * 2, q.r * 2);
          }
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        if (S.flash > 0.001) { ctx.fillStyle = "rgba(255,255,255," + S.flash + ")"; ctx.fillRect(0, 0, W, H); }
      }
      var D = 72.28, tl = gsap.timeline({ paused: true });
      var F = function (props, from, to, dur, ease, at) { var tw = { duration: dur, ease: ease || "none", immediateRender: false }; for (var k in to) tw[k] = to[k]; tl.fromTo(S, from, tw, at); };
      F(null, { t: 0 }, { t: D }, D, "none", 0);
      F(null, { zoom: 0 }, { zoom: 0.16 }, 14, "power1.inOut", 0);
      F(null, { p: 0 }, { p: 1 }, 0.7, "power2.inOut", 14.39);
      F(null, { flash: 0 }, { flash: 1 }, 0.14, "power3.in", 24.84);
      F(null, { p: 1, zoom: 0.16 }, { p: 2, zoom: 0 }, 0.01, "none", 24.98);
      F(null, { flash: 1 }, { flash: 0 }, 0.9, "power2.out", 25.0);
      F(null, { p: 2 }, { p: 3 }, 5, "sine.inOut", 29);
      F(null, { tint: 0 }, { tint: 1 }, 8, "sine.inOut", 31);
      F(null, { tint: 1 }, { tint: 0.3 }, 8, "sine.inOut", 42);
      F(null, { tint: 0.3 }, { tint: 0.8 }, 8, "sine.inOut", 50);
      F(null, { p: 3 }, { p: 4 }, 1.6, "power2.inOut", 64);
      tl.eventCallback("onUpdate", draw);
      window.__timelines["bg"] = tl;
    })();
  </script>
</template>
